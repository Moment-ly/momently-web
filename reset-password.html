<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obnova hesla | MOMENTly</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="moment-logo.png">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: #F4EFEA;
    color: #2C2C2C;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    text-align: center;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(166, 115, 91, 0.15);
  }
  h1 { font-size: 20px; margin: 0 0 14px; color: #A6735B; }
  p { font-size: 14px; line-height: 1.6; color: #6B5A4E; margin: 0; }
  .spinner {
    margin: 22px auto;
    width: 32px;
    height: 32px;
    border: 3px solid #E2D5C8;
    border-top-color: #A6735B;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    display: inline-block;
    margin-top: 20px;
    background: #A6735B;
    color: white;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Otevírám aplikaci MOMENTly…</h1>
    <div class="spinner" id="spinner"></div>
    <p id="msg">Za chvíli tě přesměrujeme zpátky do aplikace, kde nastavíš nové heslo.</p>
    <a class="btn" id="manualBtn" href="#" style="display:none;">Otevřít aplikaci ručně</a>
  </div>
<script>
  function buildAppUrl() {
    var hash = window.location.hash ? window.location.hash.slice(1) : '';
    var search = window.location.search ? window.location.search.slice(1) : '';
    var params = hash || search;
    return 'moment://reset-password' + (params ? '?' + params : '');
  }
  var appUrl = buildAppUrl();
  var manualBtn = document.getElementById('manualBtn');
  manualBtn.href = appUrl;
  manualBtn.style.display = 'inline-block';
  window.location.href = appUrl;
  setTimeout(function () {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'Pokud se aplikace neotevřela automaticky, klikni na tlačítko níže.';
  }, 1500);
</script>
</body>
</html>
