<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obnova hesla | MOMENTly</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="moment-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--linen-light:#F6F2E8;--linen-dark:#D8CDB6;--sage:#7C9380;--sage-dark:#3D5443;--text:#2A2820;--text-mid:#6B6458;--white:#FDFAF4;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Figtree',sans-serif;background:var(--linen-light);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
        .card{background:var(--white);border:1px solid var(--linen-dark);border-radius:24px;padding:48px 36px;max-width:400px;width:100%;}
        .logo-text{font-family:'Newsreader',serif;font-size:1.2rem;font-weight:400;color:var(--text);letter-spacing:-.3px;margin-bottom:32px;display:block;}
        .logo-text em{font-style:italic;color:var(--sage-dark);}
        h1{font-family:'Newsreader',serif;font-size:1.6rem;font-weight:300;color:var(--text);letter-spacing:-.5px;margin-bottom:12px;}
        h1 em{font-style:italic;color:var(--sage-dark);}
        p{font-size:.9rem;line-height:1.7;color:var(--text-mid);font-weight:300;}
        .spinner{margin:28px auto;width:32px;height:32px;border:2px solid var(--linen-dark);border-top-color:var(--sage-dark);border-radius:50%;animation:spin .8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .btn{display:inline-block;margin-top:24px;background:var(--sage-dark);color:var(--white);text-decoration:none;padding:13px 28px;border-radius:10px;font-weight:600;font-size:.9rem;transition:all .2s;}
        .btn:hover{background:#2e4234;transform:translateY(-2px);}
        .btn-light{background:transparent;color:var(--sage-dark);border:1.5px solid var(--sage-dark);margin-top:12px;}
        .btn-light:hover{background:var(--linen-dark);}
    </style>
</head>
<body>
    <div class="card">
        <span class="logo-text">MOMENT<em>ly</em></span>
        <h1>Otevírám <em>aplikaci…</em></h1>
        <div class="spinner" id="spinner"></div>
        <p id="msg">Za chvíli tě přesměrujeme zpátky do aplikace, kde nastavíš nové heslo.</p>
        <a class="btn" id="manualBtn" href="#" style="display:none;">Otevřít aplikaci ručně</a>
        <br><a class="btn btn-light" id="webBtn" href="#" style="display:none;">Pokračovat na webu</a>
    </div>
<script>
    // Odkaz z emailu vede sem. Na počítači pokračujeme ve webové verzi (/nove-heslo),
    // na telefonu zkusíme otevřít aplikaci a web nabídneme jako zálohu.
    var hash = window.location.hash ? window.location.hash.slice(1) : '';
    var search = window.location.search ? window.location.search.slice(1) : '';
    var params = hash || search;
    var query = params ? '?' + params : '';
    var appUrl = 'moment://reset-password' + query;
    var webUrl = '/nove-heslo' + query;
    var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (!isMobile) {
        window.location.replace(webUrl);
    } else {
        var manualBtn = document.getElementById('manualBtn');
        var webBtn = document.getElementById('webBtn');
        manualBtn.href = appUrl;
        manualBtn.style.display = 'inline-block';
        webBtn.href = webUrl;
        window.location.href = appUrl;
        setTimeout(function () {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('msg').textContent = 'Pokud se aplikace neotevřela automaticky, klikni na tlačítko níže. Nemáš aplikaci? Pokračuj na webu.';
            webBtn.style.display = 'inline-block';
        }, 1500);
    }
</script>
</body>
</html>
